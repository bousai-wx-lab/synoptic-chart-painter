name: Privacy gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      safety_failure_test:
        description: 'Test only: reject a harmless unlisted file before packaging'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out complete history without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Add harmless rejection probe only on requested tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.safety_failure_test }}
        run: touch publication-block-test.txt
      - name: Verify release inventory, identity, privacy, and full Git history
        run: python3 -B scripts/privacy_gate.py
      - name: Verify scanner and artifact rejection regressions
        run: |
          python3 -B scripts/test_privacy_gate.py
          python3 -B scripts/test_pages_release.py
      - name: Verify JavaScript syntax
        run: node --check app.js

  build-pages-artifact:
    needs: verify-public-surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exactly the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package only approved bytes without personal archive metadata
        run: python3 -B scripts/build_pages_artifact.py --output-dir "$RUNNER_TEMP/verified-pages"
      - name: Upload verified Pages archive from main only
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    needs: [verify-public-surface, build-pages-artifact]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify-public-surface.result == 'success' && needs.build-pages-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current_sha" = "$EXPECTED_SHA"
      - name: Deploy the same run's verified archive
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
